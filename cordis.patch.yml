# dsh-article-publish bundle patch: publish articles to CSDN / Juejin / CNBlog.
#
# Registers model-visible tools (no external MCP server required):
#   - publish_article  : publish/update on one platform, returns the URL
#   - fetch_news       : one random tech-news item as material
#
# Configuration (via the profile's cordis.patch.yml or --patch overlays):
#   - id: article-publish
#     config:
#       enabled: true
#       csdnCookie: ''        # optional; falls back to CSDN_COOKIE env
#       juejinCookie: ''      # optional; falls back to JUEJIN_COOKIE env
#       cnblogCookie: ''      # optional; falls back to CNBLOG_COOKIE env
#       cnblogToken: ''       # optional; falls back to CNBLOG_TOKEN env
#       cnblogUsername: ''    # optional; falls back to CNBLOG_USERNAME env

- insert:
    - id: article-publish
      name: 'dsh-article-publish'
      inject: [tools]
